name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore trusted FriendshipTree signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          EXPECTED_SIGNING_SHA256: D2D6C289FEDB1B0DDD55809CE6A2D78E96FA99F9070085053A3728C339FFF813
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. Add the laptop's existing Android debug.keystore as this encrypted repository secret before publishing a phone-installable APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL_SIGNING_SHA256="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          if [ "$ACTUAL_SIGNING_SHA256" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::The restored signing key does not match the FriendshipTree app installed on Joe's phone. Expected $EXPECTED_SIGNING_SHA256 but received ${ACTUAL_SIGNING_SHA256:-no fingerprint}. Replace ANDROID_DEBUG_KEYSTORE_BASE64 with C:\\Users\\Joe\\.android\\debug.keystore."
            exit 1
          fi
          echo "Trusted FriendshipTree signing certificate verified: $ACTUAL_SIGNING_SHA256"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Explicitly sign and verify phone-update APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          EXPECTED_SIGNING_SHA256: D2D6C289FEDB1B0DDD55809CE6A2D78E96FA99F9070085053A3728C339FFF813
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found on the GitHub runner."
            exit 1
          fi
          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="android/app/build/outputs/apk/debug/app-debug-trusted.apk"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$SOURCE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          APK_SIGNING_SHA256="$("$APKSIGNER" verify --print-certs "$SIGNED_APK" \
            | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+)[[:space:]]*$/\1/p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')"
          if [ "$APK_SIGNING_SHA256" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::Finished APK has the wrong signing certificate. Expected $EXPECTED_SIGNING_SHA256 but received ${APK_SIGNING_SHA256:-no fingerprint}. Nothing will be published."
            exit 1
          fi
          mv "$SIGNED_APK" "$SOURCE_APK"
          echo "Finished APK signing certificate verified: $APK_SIGNING_SHA256"

      - name: Name APK and create checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk '/versionName/ { gsub(/"/, "", $2); print $2; exit }' android/app/build.gradle)"
          test -n "$VERSION_NAME"
          APK_NAME="FriendshipTree-v${VERSION_NAME}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendshipTree-v${{ steps.package.outputs.version }}-debug-apk
          path: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish phone-downloadable APK release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          VERSION_NAME: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          TAG="android-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$APK_NAME" \
            "$APK_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "FriendshipTree Android ${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatic debug APK built from verified main commit ${GITHUB_SHA}. Download the APK asset directly on the Android phone and install it. The SHA-256 file is included for integrity checking." \
            --latest
