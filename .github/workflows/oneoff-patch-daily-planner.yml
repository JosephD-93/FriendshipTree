name: One-off patch Daily Planner

on:
  push:
    branches:
      - agent/daily-planner-today-touch-colours
    paths:
      - scripts/patch_daily_planner.py
      - .github/workflows/oneoff-patch-daily-planner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-planner-today-touch-colours
      - name: Patch App.jsx
        run: python3 scripts/patch_daily_planner.py
      - name: Remove one-off patch machinery
        run: rm scripts/patch_daily_planner.py .github/workflows/oneoff-patch-daily-planner.yml
      - name: Commit patched planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Daily Planner today view and touch event creation"
          git push origin HEAD:agent/daily-planner-today-touch-colours
