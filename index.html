<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#10b981"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FriendTree"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icon-192.svg"/>
  <title>FriendshipTree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
    html,body,#root{height:100%;margin:0;padding:0;overflow:hidden}
    body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:#0f172a}
    input,textarea{-webkit-user-select:text;user-select:text}
    #root{padding-top:env(safe-area-inset-top)}
    #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#10b981;font-family:sans-serif;gap:16px}
    #loading .tree{font-size:64px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    #loading p{color:#94a3b8;font-size:14px}
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="tree">🌳</div>
      <div style="color:#10b981;font-size:20px;font-weight:700">FriendshipTree</div>
      <p>Loading your social universe...</p>
    </div>
  </div>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Load and transpile app after Babel is ready
    fetch('/app.jsx')
      .then(r => r.text())
      .then(code => {
        const transformed = Babel.transform(code, {
          presets: ['react'],
          filename: 'app.jsx'
        }).code;
        const script = document.createElement('script');
        script.textContent = transformed;
        document.body.appendChild(script);
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = 
          '<div style="color:#ef4444;text-align:center;padding:20px">Error loading app: ' + err.message + '<br><small>Check console for details</small></div>';
        console.error(err);
      });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
